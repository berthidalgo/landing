<!doctype html><meta charset="utf-8"><title>esperando</title>
<!-- Abre este archivo en el navegador: el <title> se convierte en el informe. -->
<iframe id="f" src="../index.html" style="width:390px;height:844px;border:0"></iframe>
<script>
document.getElementById('f').addEventListener('load', function(){
 setTimeout(function(){
  var w = this.contentWindow, D = w.document, r = [];
  function chk(nombre, cond, detalle){
    r.push((cond ? 'PASA' : 'FALLA') + ' :: ' + nombre + (detalle ? ' (' + detalle + ')' : ''));
  }
  function visible(el){ return el && w.getComputedStyle(el).display !== 'none'; }
  var API = w.__LANDING__;

  var total    = D.querySelector('[data-r-total]');
  var sub      = D.querySelector('[data-r-sub]');
  var descFila = D.querySelector('[data-r-desc-fila]');
  var desc     = D.querySelector('[data-r-desc]');
  var upFila   = D.querySelector('[data-r-up-fila]');
  var barra    = D.querySelector('[data-precio-barra]');
  var up       = D.getElementById('up');
  var packs    = D.querySelectorAll('#form [data-packs] .pack');

  /* ── 1. Estado inicial ──────────────────────────────────────── */
  chk('Se pintan 3 packs en el formulario', packs.length === 3, packs.length + ' packs');
  chk('Arranca con el pack "Más vendido"', total.textContent === 'S/. 89.00', total.textContent);
  chk('Subtotal ancla en S/. 138.00', sub.textContent === 'S/. 138.00', sub.textContent);
  chk('Muestra el descuento de S/. 49.00', desc.textContent === '−S/. 49.00', desc.textContent);
  chk('Precio unitario en la ficha',
      D.querySelector('[data-precio-hero]').textContent === 'S/. 69.00',
      D.querySelector('[data-precio-hero]').textContent);
  chk('Barra fija refleja el pack elegido', barra.textContent === 'S/. 89.00', barra.textContent);

  /* ── 2. Sin complementos inventados ─────────────────────────── */
  chk('No se ofrece ningún complemento', !visible(D.querySelector('[data-upsell]')));
  chk('Fila del upsell oculta', !visible(upFila));
  chk('El resumen del pedido muestra el pack',
      D.querySelector('[data-mini-pack]').textContent === '2 unidades',
      D.querySelector('[data-mini-pack]').textContent);

  /* ── 3. Cambio de pack ──────────────────────────────────────── */
  packs[0].click();
  chk('Pack de 1: total S/. 69.00', total.textContent === 'S/. 69.00', total.textContent);
  chk('Pack de 1: sin fila de descuento', !visible(descFila));
  chk('Pack de 1: la barra baja a S/. 69.00', barra.textContent === 'S/. 69.00', barra.textContent);

  packs[2].click();
  chk('Pack de 3: total S/. 119.00', total.textContent === 'S/. 119.00', total.textContent);
  chk('Pack de 3: descuento de S/. 88.00', desc.textContent === '−S/. 88.00', desc.textContent);
  chk('Pack de 3: aria-checked se mueve', packs[2].getAttribute('aria-checked') === 'true'
      && packs[0].getAttribute('aria-checked') === 'false');

  packs[1].click();

  /* ── 3.bis Distrito dependiente de la provincia ─────────────── */
  var ciu = D.getElementById('ciu');
  var dep = D.getElementById('dep');
  chk('Distrito bloqueado sin provincia', ciu.disabled);

  dep.value = 'Lima Metropolitana'; dep.dispatchEvent(new w.Event('change'));
  chk('Lima: el distrito se desbloquea', !ciu.disabled);
  chk('Lima: aparecen sus distritos', ciu.options.length > 40, ciu.options.length + ' opciones');
  chk('Lima: incluye Los Olivos',
      [].some.call(ciu.options, function(o){ return o.value === 'Los Olivos'; }));

  dep.value = 'Piura'; dep.dispatchEvent(new w.Event('change'));
  chk('Piura: cambia la lista de distritos',
      [].some.call(ciu.options, function(o){ return o.value === 'Sullana'; }) &&
      ![].some.call(ciu.options, function(o){ return o.value === 'Los Olivos'; }));
  chk('Siempre hay opción "Otro"',
      [].some.call(ciu.options, function(o){ return o.value === 'Otro'; }));

  /* ── 3.ter Adelanto de provincia ────────────────────────────── */
  var aviso = D.querySelector('[data-adelanto]');
  dep.value = 'Lima Metropolitana'; dep.dispatchEvent(new w.Event('change'));
  chk('Lima Metropolitana: sin aviso de adelanto', !visible(aviso));
  chk('Lima Metropolitana: el envío sigue gratis',
      D.querySelector('[data-envio-val]').textContent === 'Gratis',
      D.querySelector('[data-envio-val]').textContent);

  // Barranca está a 200 km: va por agencia aunque el nombre diga "Lima".
  dep.value = 'Lima Provincias'; dep.dispatchEvent(new w.Event('change'));
  chk('Lima Provincias SÍ pide adelanto', visible(aviso));
  chk('Lima Provincias incluye Barranca',
      [].some.call(ciu.options, function(o){ return o.value === 'Barranca'; }));
  chk('Rímac es Lima Metropolitana, no Provincias',
      ![].some.call(ciu.options, function(o){ return o.value === 'Rímac'; }));

  dep.value = 'Piura'; dep.dispatchEvent(new w.Event('change'));
  chk('Provincia: avisa del adelanto', visible(aviso));
  chk('Provincia: el aviso dice el importe',
      aviso.textContent.indexOf('S/. 20.00') > -1, aviso.textContent.slice(0, 60));
  chk('Provincia: la opción de envío cambia',
      D.querySelector('[data-envio-val]').textContent.indexOf('20.00') > -1,
      D.querySelector('[data-envio-val]').textContent);

  dep.value = 'Lima Metropolitana'; dep.dispatchEvent(new w.Event('change'));

  /* ── 4. Validación del formulario ───────────────────────────── */
  var destino = null;
  API.navegar = function(url){ destino = url; };

  D.getElementById('nom').value = 'María Quispe';
  D.getElementById('cel').value = '12345';
  dep.value = 'Lima Metropolitana'; dep.dispatchEvent(new w.Event('change'));
  ciu.value = 'Los Olivos';
  D.getElementById('dir').value = 'Av. Siempre Viva 123';
  D.getElementById('ref').value = 'Portón verde';
  D.getElementById('form').dispatchEvent(new w.Event('submit', {cancelable:true}));

  chk('Celular inválido bloquea el envío', destino === null);
  chk('Celular inválido marca el campo',
      D.getElementById('cel').getAttribute('aria-invalid') === 'true');
  chk('Celular inválido muestra el mensaje',
      D.getElementById('e-cel').classList.contains('visible'));

  D.getElementById('ref').value = '';
  D.getElementById('cel').value = '987654321';
  D.getElementById('form').dispatchEvent(new w.Event('submit', {cancelable:true}));
  chk('Referencia vacía también bloquea', destino === null);

  D.getElementById('ref').value = 'Portón verde';
  D.getElementById('form').dispatchEvent(new w.Event('submit', {cancelable:true}));

  /* ── 5. Salida a WhatsApp (sin post-upsell) ─────────────────── */
  chk('Sin post-upsell: va directo a WhatsApp',
      destino && destino.indexOf('https://wa.me/') === 0, String(destino).slice(0, 24));
  chk('No aparece pantalla de post-venta', !visible(D.getElementById('postventa')));

  var msg = decodeURIComponent(String(destino));
  chk('El mensaje lleva el total a cobrar', msg.indexOf('Total a pagar al recibir: S/. 89.00') > -1);
  chk('El mensaje lleva el número de pedido', /#\d{4,}/.test(msg));
  chk('El mensaje lleva la dirección', msg.indexOf('Av. Siempre Viva 123') > -1);
  chk('El mensaje lleva la referencia', msg.indexOf('Portón verde') > -1);
  chk('El mensaje pregunta por la entrega', msg.indexOf('¿Cuándo me estaría llegando?') > -1);
  chk('El mensaje no ofrece complementos', msg.indexOf('Además:') === -1);

  /* ── 6. Modal ───────────────────────────────────────────────── */
  var modal = D.getElementById('modal');
  D.querySelector('[data-abrir]').click();
  chk('El botón abre el formulario', modal.classList.contains('abierto'));
  D.dispatchEvent(new w.KeyboardEvent('keydown', {key:'Escape'}));
  chk('Escape cierra el formulario', !modal.classList.contains('abierto'));

  /* ── 7. Teléfono: solo dígitos ──────────────────────────────── */
  var cel = D.getElementById('cel');
  cel.value = '9ab8-765 4321';
  cel.dispatchEvent(new w.Event('input'));
  chk('El campo de celular filtra a 9 dígitos', cel.value === '987654321', cel.value);

  /* ── 7.ter Reseñas: solo si son reales ──────────────────────── */
  chk('Sin reseñas reales, la sección no aparece',
      !visible(D.querySelector('[data-resenas]')));
  chk('No se menciona la falta de reseñas',
      D.body.innerText.toLowerCase().indexOf('reseñas publicadas') === -1);
  chk('No hay textos de plantilla [EJEMPLO]',
      D.body.innerText.indexOf('[EJEMPLO') === -1);

  /* ── 7.bis Huecos de imagen ─────────────────────────────────── */
  var huecos = D.querySelectorAll('[data-hueco], [data-hueco-video], [data-hueco-comparativa]');
  chk('Hay huecos marcados para las imágenes', huecos.length >= 5,
      huecos.length + ' huecos');
  chk('Los huecos se ven mientras faltan fotos',
      [].every.call(huecos, function(h){ return visible(h); }));
  chk('La galería muestra los slots pendientes',
      D.querySelectorAll('.galeria .foto-pendiente').length === 4,
      D.querySelectorAll('.galeria .foto-pendiente').length + ' slots');
  chk('Cada hueco dice qué archivo falta',
      [].every.call(D.querySelectorAll('.foto-pendiente code, .cinta-hueco code'),
                    function(c){ return c.textContent.trim().length > 3; }));
  chk('Hay hueco para el antes/después',
      visible(D.querySelector('[data-hueco-comparativa]')));
  chk('Mientras tanto se ve la versión en texto',
      visible(D.querySelector('[data-vs-texto]')));

  /* ── 8. Fidelidad a la plantilla de referencia ──────────────── */
  var cs = w.getComputedStyle;
  var btn = D.querySelector('.btn');
  chk('Tipografía Poppins', cs(D.body).fontFamily.indexOf('Poppins') > -1,
      cs(D.body).fontFamily.split(',')[0]);
  chk('CTA verde #00D084', cs(btn).backgroundColor === 'rgb(0, 208, 132)',
      cs(btn).backgroundColor);
  chk('CTA con radio de 12px', cs(btn).borderRadius === '12px', cs(btn).borderRadius);
  chk('Precio en morado #6D388B',
      cs(D.querySelector('.precio')).color === 'rgb(109, 56, 139)',
      cs(D.querySelector('.precio')).color);
  chk('Pack elegido en turquesa',
      cs(D.querySelector('#form .pack[aria-checked="true"]')).backgroundColor === 'rgb(204, 251, 241)',
      cs(D.querySelector('#form .pack[aria-checked="true"]')).backgroundColor);

  document.title = 'T|' + r.join('|');
 }.bind(this), 900);
});
</script>
